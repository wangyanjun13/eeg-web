services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    dns:
      - 223.5.5.5  # 阿里云DNS
      - 223.6.6.6  # 阿里云DNS备用
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install && npm run dev -- --host"

  backend:
    image: python:3.9
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    ports:
      - "8000:8000"
    dns:
      - 223.5.5.5  # 阿里云DNS
      - 223.6.6.6  # 阿里云DNS备用
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
    depends_on:
      - redis
    command: >
      sh -c "
        cd backend &&
        pip install -r requirements.txt &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      " 
      
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1 --loglevel warning

volumes:
  redis_data: